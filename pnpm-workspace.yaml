packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  meta-json-schema: false
  sharp: true
  workerd: true

catalog:
  '@types/node': ^26.1.1
  '@vitest/coverage-v8': ^4.1.10
  js-yaml: ^5.2.2
  oxlint: ^1.75.0
  oxlint-tsgolint: ^7.0.2001
  prettier: ^3.9.6
  typescript: ^7.0.2
  vitest: ^4.1.10

minimumReleaseAgeExclude:
  - hono@4.12.26
  - react-router@8.0.0
  - miniflare@4.20260722.0
  - wrangler@4.114.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

peerDependencyRules:
  allowedVersions:
    '@black-duty/sing-box-schema>typescript': '>=5 <8'
